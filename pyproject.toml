[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bmmns-labs"
version = "0.1.0"
description = "Labs for Building Mathematical Models in Natural Sciences course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pyright",
    "ruff",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # помилки стилю (pycodestyle)
    "F",   # помилки синтаксису та імпортів (Pyflakes)
    "I",   # автосортування імпортів (isort)
    "UP",  # оновлення застарілого синтаксису Python
]